<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c1425">
  <title>CQA Desk / Аудит диалогов</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
  <script src="/presentation.js" defer></script>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <a class="brand" href="/" aria-label="CQA Desk, главная">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 5h14v11H9l-4 3V5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="m9 10 2 2 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>CQA <span class="brand-light">Desk</span></span>
      </a>
      <div class="masthead-context">
        <span class="team-name">Democrats</span>
        <span class="model" aria-label="Настроенная модель"><span class="dot"></span><span id="model">Локальная модель</span></span>
      </div>
    </div>
  </header>
  <canvas class="comet-field" aria-hidden="true"></canvas>
  <main>
    <section class="overview" aria-labelledby="workspace-title">
      <div class="overview-copy">
        <h1 id="workspace-title" data-verse>Аудит диалогов</h1>
      </div>
      <svg class="review-visual" viewBox="0 0 548 196" aria-hidden="true">
        <defs>
          <linearGradient id="review-edge" x2="1" y2="1">
            <stop stop-color="#3d5881"/>
            <stop offset="1" stop-color="#213554"/>
          </linearGradient>
          <linearGradient id="review-light">
            <stop stop-color="#6d9eff"/>
            <stop offset=".58" stop-color="#9de6ff"/>
            <stop offset="1" stop-color="#fff0bf"/>
          </linearGradient>
        </defs>
        <path class="visual-grid" d="M4 26h540M4 62h540M4 98h540M4 134h540M4 170h540M24 10v176M96 10v176M168 10v176M240 10v176M312 10v176M384 10v176M456 10v176M528 10v176"/>
        <path class="visual-track faint" d="M178 74h25q15 0 28 12l13 12M178 122h25q15 0 28-12l13-12"/>
        <path class="visual-track" d="M178 98h66m76 0h72"/>
        <path class="visual-runner" d="M178 98h214" pathLength="100"/>
        <rect class="visual-card" x="18" y="40" width="160" height="116" rx="12"/>
        <text class="visual-label" x="34" y="59">Реплики</text>
        <rect class="visual-active" x="29" y="89" width="138" height="19" rx="4"/>
        <path class="visual-lines" d="M34 77h55m11 0h27M34 122h42m11 0h51m-104 14h61"/>
        <path class="visual-lines visual-cite" d="M35 98h90"/>
        <rect class="visual-card visual-checkpoint" x="244" y="67" width="76" height="62" rx="12"/>
        <path class="visual-check" d="m270 98 9 9 16-18"/>
        <text class="visual-label visual-middle" x="282" y="151">Критерий</text>
        <rect class="visual-card visual-score-card" x="392" y="56" width="138" height="84" rx="12"/>
        <text class="visual-label" x="408" y="77">Итоговый балл</text>
        <text class="visual-score" x="407" y="108" id="visual-score">—</text>
        <text class="visual-label" x="491" y="108">/ 100</text>
        <path class="visual-track" d="M408 122h106"/>
        <path class="visual-score-fill" d="M408 122h106" pathLength="100" stroke-dasharray="0 100" id="visual-score-fill"/>
      </svg>
    </section>
    <div class="workbar">
      <div class="actions work-actions" aria-label="Действия с диалогами">
        <label class="button secondary upload">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 15V4m-4 4 4-4 4 4M5 15v4h14v-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Загрузить диалоги <input type="file" id="upload" accept=".json,application/json">
        </label>
        <label class="button secondary upload">Импорт оценок <input type="file" id="upload-results" accept=".json,application/json"></label>
        <button class="text-button" id="demo" type="button">Примеры</button>
        <button class="secondary" id="toggle-rubric" type="button" aria-expanded="false" aria-controls="editor">Чек-лист</button>
      </div>
      <dl class="workspace-stats" aria-label="Сводка по диалогам">
        <div><dt>Оценено</dt><dd id="workspace-scored">0</dd></div>
        <div><dt>Грубые ошибки</dt><dd id="workspace-critical">0</dd></div>
      </dl>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="editor" class="panel editor" hidden aria-labelledby="rubric-title">
      <header><h2 id="rubric-title">Чек-лист</h2></header>
      <form id="rubric-form">
        <div id="criteria-editor"></div>
        <div class="actions">
          <button class="secondary" id="add" type="button">Добавить критерий</button>
          <button class="secondary" id="reset-rubric" type="button">Вернуть исходный</button>
          <button class="secondary" id="export-rubric" type="button">Скачать чек-лист</button>
          <button type="submit">Сохранить чек-лист</button>
        </div>
      </form>
    </section>
    <div class="workspace">
      <aside class="panel library" aria-labelledby="library-title">
        <header class="panel-heading"><h2 id="library-title"><span data-verse>Диалоги</span> <span class="count" id="record-count">0</span></h2></header>
        <label for="filter">Поиск по ID или языку</label>
        <input type="search" id="filter" placeholder="Например, KZ">
        <label class="filter-toggle"><input type="checkbox" id="critical-only"> Только грубые ошибки ИИ</label>
        <div id="conversation-list"></div>
      </aside>
      <section class="panel transcript" aria-labelledby="transcript-title">
        <header class="panel-heading">
          <p class="eyebrow" data-verse>Транскрипт</p>
          <h2 id="transcript-title">Выберите диалог</h2>
          <div class="transcript-tools"><p id="conversation-meta"></p><a class="audio-link" id="audio" target="_blank" rel="noopener noreferrer" hidden>Открыть запись звонка ↗</a></div>
        </header>
        <div class="turn-overview" id="turn-overview" hidden>
          <div class="turn-overview-head"><span>Ход диалога</span><span class="turn-legend"><i class="client-dot"></i>Клиент <i class="operator-dot"></i>Оператор</span></div>
          <div class="turn-rail" id="turn-rail" aria-hidden="true"></div>
        </div>
        <ol id="turns"></ol>
        <p class="evidence-note" id="evidence-note" role="status" hidden></p>
      </section>
      <section class="panel result" aria-labelledby="score-title">
        <header class="panel-heading quality-heading">
          <span class="role-icon quality-icon" aria-hidden="true">
            <svg viewBox="0 0 28 28" fill="none">
              <rect x="6" y="5.5" width="16" height="17" rx="3" stroke="currentColor" stroke-width="1.55"/>
              <path d="M10 5.5V4h8v1.5M10 11h8" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" opacity=".72"/>
              <path class="quality-check" d="m10 16 2.8 2.8 5.2-5.4" pathLength="100" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <h2 id="score-title" data-verse>Оценка качества</h2>
        </header>
        <div class="actions scoring-actions">
          <button type="button" id="score" disabled>Оценить диалог</button>
          <label id="history-label" hidden>Запуск <select id="history"></select></label>
        </div>
        <div id="results"><p class="empty">После запуска здесь появятся баллы и ссылки на реплики.</p></div>
      </section>
    </div>
  </main>
</body>
</html>
