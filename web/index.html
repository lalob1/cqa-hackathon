<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#081327">
  <title>Democrats / Аудит диалогов</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
  <script src="/presentation.js" defer></script>
  <script src="/brand-orbit.js" defer></script>
  <script src="/welcome.js" defer></script>
  <script src="/brand-ascii.js" defer></script>
  <script src="/ascii-titles.js" defer></script>
</head>
<body data-view="start" data-review-tab="dialogue">
  <canvas class="orbit-field" aria-hidden="true"></canvas>
  <button class="orbit-stage" id="orbit-stage" type="button"
    aria-label="Фоновая анимация: потяните для вращения, нажмите для импульса.">
  </button>
  <header class="masthead">
    <div class="masthead-inner">
      <a class="brand ascii-brand" href="/" aria-label="Democrats, главная">
        <canvas id="brand-ascii" aria-hidden="true"></canvas>
        <span class="sr-only">Democrats</span>
      </a>
      <div class="masthead-context">
        <span class="model" aria-label="Настроенная модель"><span class="dot"></span><span id="model">Локальная модель</span></span>
      </div>
    </div>
  </header>
  <main>
    <div class="page-heading">
      <h1 id="workspace-title" class="ascii-title ascii-title-hero" data-ascii-title="Аудит диалогов" aria-label="Аудит диалогов"><span class="ascii-title-text">Аудит диалогов</span><canvas class="ascii-title-canvas" aria-hidden="true"></canvas></h1>
      <nav class="app-nav" aria-label="Основная навигация">
        <button type="button" data-view="dialogues" aria-current="false">
          <span class="nav-icon nav-icon-dialogues" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path class="nav-bubble" d="M4 5h16v11H9l-5 4V5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path class="nav-message-lines" d="M8 9h8m-8 3h5" pathLength="100" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>
          <span>Диалоги</span>
        </button>
        <button type="button" data-view="review" aria-current="false">
          <span class="nav-icon nav-icon-review" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M7 4h10v2h3v15H4V6h3V4Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path class="nav-score-check" d="m8 13 3 3 5-6" pathLength="100" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span>Оценка</span>
        </button>
        <button type="button" data-view="checklist" id="toggle-rubric" aria-current="false" aria-expanded="false" aria-controls="editor">
          <span class="nav-icon nav-icon-checklist" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><g stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path class="nav-list-tick" d="m4 6 1.5 1.5L8 4" pathLength="100"/><path class="nav-list-tick" d="m4 13 1.5 1.5L8 11" pathLength="100"/><path class="nav-list-tick" d="m4 20 1.5 1.5L8 18" pathLength="100"/><path class="nav-list-lines" d="M12 6h8m-8 7h8m-8 7h8"/></g></svg></span>
          <span>Чек-лист</span>
        </button>
      </nav>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="start-view" aria-labelledby="workspace-title">
      <button id="ascii-stage" class="ascii-stage" type="button" aria-label="Вращайте ASCII-логотип F. Нажмите для светового импульса.">
        <canvas id="ascii-canvas" aria-hidden="true"></canvas>
      </button>
      <div class="start-actions">
        <button type="button" id="enter-workspace" class="primary start-button" aria-label="Открыть диалоги" title="Открыть диалоги" disabled>
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </section>
    <section id="dialogues-view" class="library" hidden aria-labelledby="library-title">
      <header class="view-heading">
        <h2 id="library-title" class="ascii-title ascii-title-section" data-ascii-title="Диалоги" aria-label="Диалоги"><span class="ascii-title-text">Диалоги</span><canvas class="ascii-title-canvas" aria-hidden="true"></canvas></h2>
        <div class="actions">
          <label class="button upload primary icon-button" title="Загрузить диалоги">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 16V4m-4 4 4-4 4 4M5 15v5h14v-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <input type="file" id="upload" accept=".json,application/json" aria-label="Загрузить диалоги">
          </label>
          <details class="import-menu">
            <summary aria-label="Другие действия"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></summary>
            <div class="menu-content">
              <label class="button upload secondary">Импорт оценок<input type="file" id="upload-results" accept=".json,application/json"></label>
              <button class="secondary" id="refresh-runs" type="button">Обновить историю</button>
              <button class="secondary" id="demo" type="button">Открыть примеры</button>
            </div>
          </details>
        </div>
      </header>
      <div class="list-tools">
        <label class="search-field">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.7" stroke="currentColor" stroke-width="1.7"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          <span class="sr-only">Поиск по ID или языку</span>
          <input type="search" id="filter" placeholder="Поиск по ID или языку">
        </label>
        <div class="list-filters" aria-label="Фильтр диалогов">
          <button type="button" data-list-filter="all" aria-pressed="true">Все</button>
          <button type="button" data-list-filter="pending" aria-pressed="false">Без оценки</button>
          <button type="button" data-list-filter="final-critical" aria-pressed="false">Грубые после пересмотра</button>
          <button type="button" data-list-filter="appeal" aria-pressed="false">Открытые апелляции</button>
          <label class="filter-chip"><input type="checkbox" id="critical-only" class="sr-only">Грубые ошибки ИИ</label>
        </div>
      </div>
      <p class="meta">Фильтры оценок используют последний сохранённый запуск каждого диалога.</p>
      <div id="import-errors" role="alert" hidden></div>
      <div id="conversation-list" class="list-group"></div>
    </section>
    <section id="review-view" class="review-view" hidden aria-label="Проверка диалога">
      <div class="review-bar">
        <button type="button" id="back-to-list" class="back-button"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m13 5-7 7 7 7M6 12h14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>Диалоги</button>
        <div class="review-tabs" aria-label="Раздел диалога">
          <button type="button" data-review-tab="dialogue" aria-pressed="true">Переписка</button>
          <button type="button" data-review-tab="score" aria-pressed="false">Оценка</button>
        </div>
      </div>
      <div class="workspace">
        <section class="panel transcript" aria-labelledby="transcript-title">
          <header class="chat-heading">
            <span class="role-icon role-operator" aria-hidden="true"><svg viewBox="0 0 28 28" fill="none"><path d="M6.7 15v-1.9a7.3 7.3 0 0 1 14.6 0v1.9M21 18v1a3 3 0 0 1-3 3h-3" stroke="currentColor" stroke-width="1.65" stroke-linecap="round"/><g class="glyph-cups" fill="currentColor"><rect x="5.5" y="13.5" width="4.5" height="6.5" rx="1.8"/><rect x="18" y="13.5" width="4.5" height="6.5" rx="1.8"/></g></svg></span>
            <div class="chat-heading-copy"><h2 id="transcript-title" tabindex="-1">Выберите диалог</h2><div class="transcript-tools"><p id="conversation-meta"></p><a class="audio-link" id="audio" target="_blank" rel="noopener noreferrer" hidden>Запись звонка ↗</a></div></div>
          </header>
          <div class="turn-overview" id="turn-overview" hidden>
            <div class="turn-overview-head"><span class="sr-only">Ход диалога</span><span class="turn-legend"><i class="client-dot"></i>Клиент <i class="operator-dot"></i>Оператор</span></div>
            <div class="turn-rail" id="turn-rail" aria-hidden="true"></div>
          </div>
          <ol id="turns"></ol>
          <p class="evidence-note" id="evidence-note" role="status" hidden></p>
        </section>
        <section class="panel result" aria-labelledby="score-title">
          <header class="quality-heading">
            <span class="role-icon quality-icon" aria-hidden="true"><svg viewBox="0 0 28 28" fill="none"><rect x="6" y="5.5" width="16" height="17" rx="3" stroke="currentColor" stroke-width="1.55"/><path d="M10 5.5V4h8v1.5M10 11h8" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" opacity=".72"/><path class="quality-check" d="m10 16 2.8 2.8 5.2-5.4" pathLength="100" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <h2 id="score-title" data-verse>Оценка качества</h2>
          </header>
          <div class="actions scoring-actions"><button type="button" id="score" class="primary" disabled>Оценить диалог</button><label id="history-label" hidden>История <select id="history"></select></label></div>
          <div id="results"></div>
        </section>
      </div>
    </section>
    <section id="editor" class="editor" hidden aria-labelledby="rubric-title">
      <header class="view-heading"><h2 id="rubric-title">Чек-лист</h2><button type="button" id="export-rubric" class="secondary">Скачать</button></header>
      <form id="rubric-form">
        <div id="criteria-editor" class="list-group"></div>
        <div class="editor-actions actions"><button type="submit" class="primary">Сохранить</button><button class="secondary" id="add" type="button">Добавить критерий</button><button class="text-button" id="reset-rubric" type="button">Сбросить</button></div>
      </form>
    </section>
  </main>
</body>
</html>
